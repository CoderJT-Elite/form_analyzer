# 8G of heap exceeds what standard CI runners (and many laptops) can allocate,
# and Gradle fails to start rather than falling back. 4G builds this project
# comfortably.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
